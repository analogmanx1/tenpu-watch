name: daily-pmda-watch

# 役割: サイトの「ビルドと公開」だけ(2026-08-26変更)。
# 取り込み(PMDAからの取得・コミット)はPC側タスク(scripts/local_update.ps1)が担当。
#   - PMDAが個別ページを海外・クラウドIPからブロックしているためActionsでは中身が取れない
#   - 以前はActionsも取り込み・コミットしていたが、PC側とほぼ同時刻にコミットして
#     マージ衝突→自動更新の全停止を起こしたため、書き手はPC側の1系統に絞った
# 定時実行は「公開の保険」(pushの取りこぼしがあっても1日2回は必ず再公開される)。

on:
  schedule:
    # 毎日 07:00 JST(= 22:00 UTC 前日)と 17:00 JST(= 08:00 UTC)。GitHubの都合で数分〜数十分遅れることあり
    - cron: "0 22 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch: {}   # 手動実行ボタン
  push:                   # 手で編集してpushしたときと、PC側タスクが更新をpushしたときに即公開
    branches: [main]
    paths: ["src/**", "site/**", "docs/tools/**", ".github/workflows/**", "data/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pmda-watch
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Tokyo
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: サイト生成(リポジトリ内のデータから。取得・コミットはしない)
        run: python src/run.py --build-only

      - name: Pages用にアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
