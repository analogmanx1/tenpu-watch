name: daily-pmda-watch

on:
  schedule:
    # 毎日 07:00 JST(= 22:00 UTC 前日)と 17:00 JST(= 08:00 UTC)。
    # PMDAの掲載が平日15時台らしい(実測)ので、17時の回で当日分を拾う。GitHubの都合で数分〜数十分遅れることあり
    - cron: "0 22 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch: {}   # 手動実行ボタン
  push:                   # 手で編集してpushしたときも即公開(ボットの自動コミットでは動かない=無限ループしない)
    branches: [main]
    paths: ["src/**", "site/**", "docs/tools/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pmda-watch
  cancel-in-progress: false

jobs:
  fetch-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # 普段は1分未満。PMDA側が応答しない日に6時間つかまらないための保険
    env:
      TZ: Asia/Tokyo
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 取得 → 保存 → サイト生成
        run: python src/run.py

      - name: 変更をコミット
        run: |
          git config user.name "pmda-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data archive docs
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "auto: $(date +'%Y-%m-%d %H:%M') JST 更新取り込み"
            git push
          fi

      - name: Pages用にアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: fetch-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
