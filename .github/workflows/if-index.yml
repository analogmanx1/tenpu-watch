name: if-index (インタビューフォーム/添付文書一覧の毎日更新)

# 毎日 00:15 JST に、PMDAの検索を薬効分類ごとに回して data/if_index.json(インタビューフォーム)と
# data/tenpu_index.json(添付文書)を作り直し、サイトを再生成して公開する(合計20〜30分)。
# すぐ取り直したいときは Actions タブ → 「if-index」 → Run workflow。
# 時刻を変えるときは下の cron を直す(UTC表記。JST−9時間。ちょうど0分はGitHubが混むので少しずらすのがコツ)。
on:
  schedule:
    - cron: "15 15 * * *"   # 毎日 00:15 JST(= 15:15 UTC 前日)
  workflow_dispatch: {}   # 手動実行ボタン

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pmda-watch          # daily と同じグループ(同時にコミットしてぶつからないように)
  cancel-in-progress: false

jobs:
  refresh-if-index:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # IF 数分 + 添付文書 10〜20分(どちらも1秒待ちの礼儀正しいアクセス)
    env:
      TZ: Asia/Tokyo
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: IF一覧・添付文書一覧を取り直し → サイト生成
        run: python src/run.py --build-only --if-index --tenpu-index

      - name: 変更をコミット
        run: |
          git config user.name "pmda-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data docs
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "auto: $(date +'%Y-%m-%d %H:%M') JST インタビューフォーム/添付文書一覧を更新"
            git push
          fi

      - name: Pages用にアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: refresh-if-index
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
