name: if-index (インタビューフォーム一覧の取り直し・手動)

# 毎日は回さない。Actions タブ → 「if-index」 → Run workflow を押したときだけ動く。
# PMDAの検索を薬効分類ごとに回して data/if_index.json を作り直し、サイトを再生成して公開する(数分)。
on:
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pmda-watch          # 毎朝の daily と同じグループ(同時にコミットしてぶつからないように)
  cancel-in-progress: false

jobs:
  refresh-if-index:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: IF一覧を取り直し → サイト生成
        run: python src/run.py --build-only --if-index

      - name: 変更をコミット
        run: |
          git config user.name "pmda-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data docs
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "auto: $(date +'%Y-%m-%d %H:%M') JST インタビューフォーム一覧を更新"
            git push
          fi

      - name: Pages用にアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: refresh-if-index
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
